<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" role="img" aria-label="Lembar komponen Kirana UI berisi tombol, formulir, dan kartu">
  <defs>
    <linearGradient id="p3bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f0ff" />
      <stop offset="1" stop-color="#e3ecff" />
    </linearGradient>
    <linearGradient id="p3a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5bff" />
      <stop offset="1" stop-color="#22c7f0" />
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#p3bg)" />
  <rect x="24" y="24" width="552" height="402" rx="18" fill="#ffffff" />
  <rect x="24" y="24" width="552" height="42" rx="18" fill="#f7f5ff" />
  <text x="44" y="51" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#241d4a">KIRANA UI</text>
  <text x="128" y="51" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8a83ad">design system v1.2</text>
  <g fill="#cfc7ee">
    <circle cx="520" cy="45" r="6" />
    <circle cx="540" cy="45" r="6" />
    <circle cx="560" cy="45" r="6" />
  </g>

  <!-- kolom token -->
  <text x="44" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#8a83ad">COLOR TOKENS</text>
  <g transform="translate(44 102)">
    <rect width="40" height="40" rx="9" fill="#6d5bff" />
    <rect x="48" width="40" height="40" rx="9" fill="#22c7f0" />
    <rect x="96" width="40" height="40" rx="9" fill="#ff4fa3" />
    <rect x="144" width="40" height="40" rx="9" fill="#151226" />
    <rect y="50" width="40" height="40" rx="9" fill="#f7f5ff" stroke="#e2ddf7" stroke-width="2" />
    <rect x="48" y="50" width="40" height="40" rx="9" fill="#dcd6f5" />
    <rect x="96" y="50" width="40" height="40" rx="9" fill="#a9a0d8" />
    <rect x="144" y="50" width="40" height="40" rx="9" fill="#ffffff" stroke="#e2ddf7" stroke-width="2" />
  </g>

  <text x="44" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#8a83ad">TYPOGRAPHY</text>
  <text x="44" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#151226">Aa 32</text>
  <text x="44" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#3d3766">Aa 20</text>
  <text x="44" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8a83ad">Aa 13 body</text>

  <text x="44" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#8a83ad">SPACING / RADIUS</text>
  <g transform="translate(44 348)">
    <rect width="26" height="26" rx="6" fill="url(#p3a)" opacity="0.85" />
    <rect x="36" width="36" height="26" rx="10" fill="url(#p3a)" opacity="0.65" />
    <rect x="84" width="46" height="26" rx="14" fill="url(#p3a)" opacity="0.45" />
    <rect x="142" width="46" height="26" rx="26" fill="url(#p3a)" opacity="0.3" />
  </g>

  <!-- kolom komponen -->
  <text x="256" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#8a83ad">BUTTONS</text>
  <g transform="translate(256 104)">
    <rect width="96" height="34" rx="17" fill="url(#p3a)" />
    <text x="48" y="22" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Primary</text>
    <rect x="108" width="96" height="34" rx="17" fill="none" stroke="#6d5bff" stroke-width="2" />
    <text x="156" y="22" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#6d5bff">Outline</text>
    <rect y="44" width="96" height="34" rx="17" fill="#f7f5ff" />
    <text x="48" y="66" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8a83ad">Ghost</text>
    <rect x="108" y="44" width="96" height="34" rx="17" fill="#e2ddf7" />
    <text x="156" y="66" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5c5488">Disabled</text>
  </g>

  <text x="256" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#8a83ad">FORM</text>
  <g transform="translate(256 200)">
    <rect width="204" height="34" rx="9" fill="#ffffff" stroke="#d9d3f0" stroke-width="2" />
    <text x="12" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8a83ad">Email</text>
    <rect y="44" width="204" height="34" rx="9" fill="#ffffff" stroke="#6d5bff" stroke-width="2" />
    <text x="12" y="66" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#241d4a">Nama lengkap|</text>
    <rect y="88" width="98" height="24" rx="12" fill="#e8f8ef" />
    <circle cx="14" cy="100" r="6" fill="#22b573" />
    <text x="26" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#1a7f52">Valid</text>
  </g>

  <text x="256" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#8a83ad">CARD &amp; SWITCH</text>
  <g transform="translate(256 342)">
    <rect width="120" height="62" rx="12" fill="#f7f5ff" stroke="#e2ddf7" stroke-width="2" />
    <rect x="12" y="12" width="42" height="38" rx="8" fill="url(#p3a)" opacity="0.8" />
    <rect x="62" y="14" width="46" height="8" rx="4" fill="#241d4a" />
    <rect x="62" y="28" width="34" height="6" rx="3" fill="#a9a0d8" />
    <rect x="62" y="40" width="40" height="6" rx="3" fill="#a9a0d8" />
    <rect x="136" y="16" width="60" height="30" rx="15" fill="url(#p3a)" />
    <circle cx="181" cy="31" r="11" fill="#ffffff" />
    <rect x="136" y="52" width="44" height="8" rx="4" fill="#d9d3f0" />
  </g>
</svg>
