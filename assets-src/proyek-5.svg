  <text x="96" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#5b3a17">Redesain kemasan</text>
  <text x="96" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8c6134">satu sistem grid untuk 3 ukuran botol</text>
